<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Band Repertorio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
    <div id="app">
        <header>
            <h1>Band Repertorio</h1>
            <div class="band-edit">
                <label for="band-name">Nombre de la banda:</label>
                <input type="text" id="band-name" placeholder="Nombre de la banda">
                <button id="save-band">Guardar</button>
            </div>
        </header>
        <nav>
            <button class="nav-tab active" data-section="repertory">Repertorio</button>
            <button class="nav-tab" data-section="events">Eventos</button>
            <button class="nav-tab" data-section="rehearsals">Ensayos</button>
            <button class="nav-tab" data-section="settings">Ajustes</button>
        </nav>
        <main>
            <section id="repertory" class="section active">
                <h2>Repertorio</h2>
                <div class="add-song">
                    <input type="text" id="song-search" placeholder="Buscar canción...">
                    <ul id="song-suggestions" class="suggestions"></ul>
                </div>
                <div id="song-list" class="song-list"></div>
                <button id="add-to-event-btn" class="action-btn" disabled>Agregar a evento</button>
                <button id="add-to-rehearsal-btn" class="action-btn" disabled>Agregar a ensayo</button>
            </section>
            <section id="events" class="section">
                <h2>Eventos</h2>
                <div class="event-controls">
                    <button id="add-event">+ Nuevo evento</button>
                </div>
                <div id="event-list" class="event-list"></div>
            </section>
            <section id="rehearsals" class="section">
                <h2>Ensayos</h2>
                <div class="rehearsal-controls">
                    <button id="add-rehearsal">+ Nuevo ensayo</button>
                </div>
                <div id="rehearsal-list" class="rehearsal-list"></div>
            </section>
            <section id="settings" class="section">
                <h2>Ajustes</h2>
                <div class="settings-group">
                    <label>API Key de Gemini:</label>
                    <input type="text" id="gemini-api-key" placeholder="Ingresa tu API key de Gemini">
                </div>
                <button id="save-settings">Guardar ajustes</button>
            </section>
        </main>
    </div>

    <!-- Song Detail Popup -->
    <div id="song-popup" class="popup">
        <div class="popup-content">
            <span class="popup-close">&times;</span>
            <div id="popup-content-inner"></div>
        </div>
    </div>

    <!-- Event/Rehearsal Detail Popup -->
    <div id="detail-popup" class="popup">
        <div class="popup-content">
            <span class="detail-popup-close">&times;</span>
            <div id="detail-popup-inner"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
